<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behind the Scenes</title><style>*{box-sizing:border-box}body{margin:0;background:#111b24;color:#f5ead8;font:17px system-ui}header,main{max-width:1000px;margin:auto;padding:22px}h1{font-size:clamp(32px,6vw,64px);margin:12px 0}h2{font-size:30px}small{color:#e8bc75}button{font:inherit;cursor:pointer;border:1px solid #59717b;background:#263c48;color:white;padding:12px 16px;border-radius:12px;touch-action:manipulation}button:hover,button.sel{background:#e8bc75;color:#17232c}nav{display:flex;gap:7px;overflow:auto;padding:8px 0}nav button{white-space:nowrap}article{background:#1e303b;border:1px solid #415560;border-radius:22px;padding:22px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.tile{min-height:100px}.emoji{font-size:36px;display:block}.scene{background:linear-gradient(#41586b,#253744 72%,#876e53 72%);border-radius:16px;position:relative;min-height:200px;overflow:hidden;display:flex;align-items:end;justify-content:space-around;padding:30px 8px}.person{font-size:clamp(35px,8vw,75px);text-align:center;animation:bob 2s ease-in-out infinite alternate}.person:nth-child(2n){animation-delay:-1s}.person small{display:block;font-size:12px;color:white}.beam{position:absolute;top:0;left:20%;width:65%;height:100%;background:#ffe3a322;clip-path:polygon(10% 0,0 100%,100% 100%);transform-origin:10% 0;animation:sweep 5s infinite alternate;pointer-events:none}@keyframes sweep{to{transform:rotate(20deg)}}@keyframes bob{to{transform:translateY(-9px)}}.paused *{animation-play-state:paused!important}li{margin:12px 0}details{background:#14242d;padding:14px;border-radius:12px;margin:12px 0}summary{cursor:pointer}footer{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}progress{width:100%;accent-color:#e8bc75}textarea{width:100%;min-height:90px;background:#13242d;color:white;border:1px solid #59717b;border-radius:12px;padding:12px;font:inherit}.ok{color:#a8e3b5}.bad{color:#ffb5a0}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><header><small>FILM STUDIO / A2 / 120 MINUTES</small><h1>Behind the Scenes 🎬</h1><p>Making films × Present Continuous</p><progress id="progress" max="10" value="1"></progress><nav id="nav"></nav></header><main><article id="content"></article><footer><button onclick="go(page-1)">← Previous</button><button onclick="toggleMotion()">⏯ Motion</button><button onclick="timer()" id="clock">⏱ 60 s</button><button onclick="go(page+1)">Next →</button></footer></main><script>
const words=[['actor','🎭','a person who performs in a film','rehearsing a scene'],['costume','🧥','clothes worn by a character','wearing a silver jacket'],['director','🎬','the person who controls how a film is made','giving instructions'],['make-up artist','💄','a person who changes how actors look','painting a scar'],['set','🏰','the place built or prepared for filming','building a castle'],['camera operator','🎥','a person who films the action','moving the camera'],['digital camera','📷','a device that records digital images','checking the camera'],['lights','💡','equipment that makes a scene brighter','adjusting the lights'],['script','📄','the written words and actions of a film','reading the script'],['sound engineer','🎧','a person who records and checks sound','testing a microphone']];
const stages=[['Movie Talk',10],['Film Studio',15],['Match & Move',15],['Behind the Scenes',15],['What’s Going Wrong?',15],['Intermission',5],['Spot the Difference',15],['Mystery Movie',10],['Create Your Movie',15],['Final Challenge',5]];let page=0,idx=0,selected=-1,matched=[],seconds=60,tick=null;const $=id=>document.getElementById(id);const shuffle=a=>[...a].sort(()=>Math.random()-.5);let order=shuffle(words.map((_,i)=>i));const qs=a=>'<ol>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>';const hint=s=>`<details><summary>Language support</summary>${s}</details>`;const scene=a=>'<div class="scene"><div class="beam"></div>'+a.map(x=>`<div class="person">${x[0]}<small>${x[1]}</small></div>`).join('')+'</div>';const cards=[['A space film',[['👩‍🚀','actor / floating'],['🎥','camera operator / filming'],['🎧','sound engineer / listening'],['💡','lights / flashing']]],['A fantasy film',[['🧙','actor / holding a wand'],['💄','make-up artist / painting'],['🎬','director / pointing'],['🏰','crew / building']]],['A comedy',[['🤡','actor / dancing'],['📄','director / reading'],['🎥','camera operator / kneeling'],['🧥','actor / changing']]],['An adventure film',[['🧗','actor / climbing'],['🎧','sound engineer / recording'],['💡','crew / moving lights'],['🎬','director / watching']]]];const problems=[['The sound engineer is wearing headphones, but a phone is ringing loudly.','The actor is whispering. The microphone is on the floor.'],['The director is explaining a scene, but the actors are playing a game.','The camera operator is filming an empty chair.'],['The make-up artist is painting a blue face for a realistic school film.','An actor is wearing a pirate costume.'],['The crew is filming a night scene. All the lights are shining brightly.','The camera operator is pointing the camera at the ceiling.']];const mysteries=[['A boy is flying on a broom. Two teams are chasing a tiny golden ball.','Harry Potter'],['A huge ship is sinking. People are climbing into small boats.','Titanic'],['A family is leaving for a holiday. A boy is staying at home and setting traps.','Home Alone'],['A young woman is building an ice palace. Snow is falling around her.','Frozen']];let picks=['','',''];const pools=[['a space station','a haunted school','a jungle','an underwater city'],['a nervous actor','a robot','two rival directors','a famous singer'],['the lights are going out','a costume is disappearing','a camera is falling','a strange noise is coming from the set']];function go(n){page=Math.max(0,Math.min(9,n));idx=0;render();window.scrollTo(0,0)}function nextCard(){idx++;render()}function toggleMotion(){document.body.classList.toggle('paused')}function timer(){if(tick){clearInterval(tick);tick=null;return}seconds=seconds||60;tick=setInterval(()=>{$('clock').textContent='⏱ '+(--seconds)+' s';if(seconds<=0){clearInterval(tick);tick=null}},1000)}function match(i){selected=i;render()}function answer(i){if(selected===i){matched.push(i);selected=-1;render();$('feedback').textContent='Correct! Say a sentence about this word.'}else{$('feedback').textContent='Try again. Explain your choice aloud.'}}function randomize(i){let a=pools[i];picks[i]=a[Math.floor(Math.random()*a.length)];render()}function render(){ $('nav').innerHTML=stages.map((s,i)=>`<button class="${i===page?'sel':''}" onclick="go(${i})">${i+1}. ${s[0]}</button>`).join('');$('progress').value=page+1;let h=`<small>STAGE ${page+1} / ${stages[page][1]} MIN</small><h2>${stages[page][0]}</h2>`;let c=cards[idx%4];if(page===0)h+=scene([['🍿','cinema'],['🎬','film'],['📺','screen']])+qs(['What kinds of films do you enjoy? Why?','Are you watching any series this week?','What is happening in the last film you remember? Describe one scene.','Which film job sounds interesting to you? Why?','Ask your teacher two questions about films.']);if(page===1)h+='<p>Tap each card. Explain the word in English, then describe an action connected with it.</p><div class="grid">'+words.map((w,i)=>`<button class="tile" onclick="document.getElementById('word${i}').hidden=!document.getElementById('word${i}').hidden"><span class="emoji">${w[1]}</span>${w[0]}<span id="word${i}" hidden><hr>${w[2]}<br><small>${w[3]}</small></span></button>`).join('')+'</div>'+qs(['Which three things can you find on a film set?','Which four people work behind the camera?','Describe three jobs without naming them.']);if(page===2)h+='<p>Tap a word, then its definition. After each match, say a new Present Continuous sentence.</p><div class="grid"><div>'+words.map((w,i)=>`<button style="display:block;width:100%;margin:5px 0" ${matched.includes(i)?'disabled':''} class="${selected===i?'sel':''}" onclick="match(${i})">${matched.includes(i)?'✓ ':''}${w[0]}</button>`).join('')+'</div><div>'+order.map(i=>`<button style="display:block;width:100%;margin:5px 0" ${matched.includes(i)?'disabled':''} onclick="answer(${i})">${words[i][2]}</button>`).join('')+'</div></div><p id="feedback" aria-live="polite">'+matched.length+'/10 matched</p><button onclick="matched=[];selected=-1;order=shuffle(order);render()">Reset</button>';if(page===3)h+=`<h3>${c[0]}</h3>`+scene(c[1])+qs(['Describe every person or object using a full sentence.','What is the director doing? If you cannot see them, make a guess.','What aren’t the actors doing?','Ask three questions about the scene.','Connect two actions using while.'])+hint('The actor is … / They aren’t … / Is the …-ing? / While … is …, … is …')+'<button onclick="nextCard()">Next set ↻</button>';if(page===4)h+=`<h3>Take ${idx%4+1}: Something is wrong!</h3><p>${problems[idx%4].join(' ')}</p>`+qs(['Find two problems. What is happening?','What isn’t working properly?','Why is this a problem?','What should the crew change?','Imagine the corrected scene. Describe what everyone is doing now.'])+'<button onclick="nextCard()">Another problem ↻</button>';if(page===5)h+='<p>Five-minute break. Rest your eyes and stretch.</p>'+scene([['☕','break'],['🍿','snack']]);if(page===6)h+='<h3>Set A</h3>'+scene(c[1])+'<h3>Set B</h3>'+scene(cards[(idx+1)%4][1])+qs(['Find at least four differences.','What is happening in A but not in B?','Ask your teacher two yes/no questions about Set B.','Which set is more difficult to film? Why?'])+'<button onclick="nextCard()">New comparison ↻</button>';if(page===7)h+=`<p>${mysteries[idx%4][0]}</p>`+qs(['Guess the film. Explain your answer.','What else is happening in this scene?','Describe another film without naming it.'])+hint(mysteries[idx%4][1])+'<button onclick="nextCard()">Next mystery ↻</button>';if(page===8)h+='<p>Generate three elements and invent a film scene. No acting required.</p><div class="grid">'+pools.map((p,i)=>`<button class="tile" onclick="randomize(${i})">${['📍 Location','🎭 Character','⚡ Problem'][i]}<hr>${picks[i]||'Tap to generate'}</button>`).join('')+'</div>'+qs(['What kind of film is it?','What are the actors wearing and doing?','What are the director and camera operator doing?','What is the sound engineer recording?','Describe the problem and what is happening next.','Speak for 60 seconds using at least six target words.'])+hint('At the moment … / Meanwhile … / Nobody is … / While … / Suddenly …');if(page===9)h+=qs(['Name five film-related words and explain two.','Describe three actions happening on an imaginary set.','Make one negative sentence and two questions.','What are you getting better at?'])+'<p>My best sentence today:</p><textarea id="note" placeholder="Write a sentence…" oninput="try{localStorage.setItem(\'filmnote\',this.value)}catch(e){}"></textarea>';h+=hint('Present Continuous: am / is / are + verb-ing. Negative: am not / isn’t / aren’t + verb-ing. Questions: Am / Is / Are + subject + verb-ing? We normally use know, like, love, understand, prefer and remember in simple forms.');$('content').innerHTML=h;if(page===9)try{$('note').value=localStorage.getItem('filmnote')||''}catch(e){}}render();</script></html>
